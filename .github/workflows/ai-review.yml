name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  ai-review:
    uses: smahendra7/boAt_GithubAction/.github/workflows/ai-pr-automation.yml@main

    permissions:
      contents: read
      pull-requests: write

    secrets:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
